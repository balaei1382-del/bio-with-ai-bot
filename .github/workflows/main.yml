name: Post to Telegram

on:
  # اجرای دستی از تب Actions (برای تست — سقف روزانه را نادیده می‌گیرد)
  workflow_dispatch:
    inputs:
      post_type:
        description: 'نوع پست (auto = انتخاب خودکار وزنی)'
        type: choice
        default: auto
        options: [auto, news, tip, roadmap, tool]
      with_image:
        description: 'تصویر ساخته شود؟'
        type: boolean
        default: true
      force_post:
        description: 'نادیده‌گرفتن سقف روزانه (پست الزامی)'
        type: boolean
        default: true
      dry_run:
        description: 'فقط تمرین: بدون ارسال به کانال و بدون AI'
        type: boolean
        default: false

  # ─── زمان‌بندی: هر ۳۰ دقیقه، ساعت ۳ تا ۲۰ UTC ───
  # یعنی ~۶:۳۰ تا ۲۱:۰۰ به وقت تهران (۳۶ بازه در روز)
  # خودِ ربات هر روز صبح یک هدف تصادفی بین ۲۰ تا ۳۰ پست انتخاب می‌کند
  # و وقتی به آن رسید، اجراهای بعدی را رد می‌کند (تا پست اضافه نرود)
  schedule:
    - cron: "*/30 3-20 * * *"

permissions:
  contents: write   # برای ذخیره state (لینک‌های پست‌شده + شمارنده روزانه)

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: نصب پیش‌نیازها
        run: pip install -r requirements.txt

      - name: تولید و ارسال پست
        env:
          BOT_TOKEN:      ${{ secrets.BOT_TOKEN }}
          AI_CONFIG:      ${{ secrets.AI_CONFIG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # سازگاری قدیمی
          CHANNEL_ID:     "@Bio_with_AI"
          DAILY_MIN:      "20"
          DAILY_MAX:      "30"
          FORCE_TYPE:     ${{ inputs.post_type != 'auto' && inputs.post_type || '' }}
          WITH_IMAGE:     ${{ inputs.with_image == false && '0' || '1' }}
          FORCE_POST:     ${{ inputs.force_post && '1' || '0' }}
        run: python bot.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: ذخیره وضعیت (ضدتکرار + شمارنده روزانه)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: update posted state" && git push)
