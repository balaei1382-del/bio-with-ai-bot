name: Test Image Generation

on:
  workflow_dispatch:  # اجرای دستی

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Check files
        run: |
          echo "=== فایل‌های موجود ==="
          ls -la
          echo ""
          echo "=== محتوای test_image.py ==="
          head -20 test_image.py || echo "❌ فایل test_image.py پیدا نشد!"
      
      - name: Install dependencies
        run: |
          pip install requests
          echo "✅ requests نصب شد"
      
      - name: Run image test
        env:
          AI_CONFIG: ${{ secrets.AI_CONFIG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== شروع تست ==="
          python test_image.py 2>&1
          echo "=== پایان تست ==="
      
      - name: Upload test images
        uses: actions/upload-artifact@v4
        with:
          name: test-images
          path: |
            test_*.png
          if-no-files-found: ignore
